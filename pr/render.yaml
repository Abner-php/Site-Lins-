services:
  - type: web
    name: jonas-lins-api
    runtime: docker
    rootDir: backend-java
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jonas-lins-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: jonas-lins-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: jonas-lins-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: APP_JONAS_EMAIL
        value: jonas.guita.jazz@gmail.com
  - type: web
    name: jonas-lins-site
    runtime: static
    buildCommand: mkdir -p public && cp index.html style.css script.js curso.html curso.css curso.js aluno.html aluno.js admin.html admin.js course-config.js public/
    staticPublishPath: public
databases:
  - name: jonas-lins-db
    plan: free
    databaseName: jonaslins
    user: jonaslins
