name: Supabase database tests

on:
  pull_request:
    paths:
      - 'pr/supabase/**'
      - '.github/workflows/supabase-database.yml'
  push:
    branches: [dev]
    paths:
      - 'pr/supabase/**'
      - '.github/workflows/supabase-database.yml'

permissions:
  contents: read

jobs:
  migrations-and-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pr
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
      - name: Start Supabase and apply migrations
        run: supabase start
      - name: Exercise anonymous, student and teacher policies
        run: supabase test db
